apiVersion: config.lighthouse.jenkins-x.io/v1alpha1
kind: TriggerConfig
spec:
  presubmits:
    - name: platform-upgrade-pr
      context: platform-upgrade
      always_run: true
      optional: false
      trigger: "/test"
      rerun_command: "/retest"
      source: "pullrequest.yaml"
  
  postsubmits:
    - name: platform-upgrade
      context: platform-upgrade
      source: "release.yaml"
      branches:
        - ^main$
        - ^master$

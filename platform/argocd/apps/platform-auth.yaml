apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-auth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bdchatham/ArbiterPipelineInfrastructure.git
    targetRevision: HEAD
    path: platform/auth
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: auth-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

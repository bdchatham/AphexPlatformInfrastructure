apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
  namespace: {{TENANT_NAME}}
  labels:
    arbiter.io/tenant: "{{TENANT_NAME}}"
    arbiter.io/managed-by: "platform-controller"
spec:
  limits:
    # Container limits
    - type: Container
      default:
        cpu: "1"
        memory: "2Gi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "50m"
        memory: "128Mi"
    
    # Pod limits
    - type: Pod
      max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "50m"
        memory: "128Mi"
    
    # PersistentVolumeClaim limits
    - type: PersistentVolumeClaim
      max:
        storage: "10Gi"
      min:
        storage: "1Gi"

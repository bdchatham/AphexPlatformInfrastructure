apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-isolation
  namespace: {{TENANT_NAME}}
  labels:
    arbiter.io/tenant: "{{TENANT_NAME}}"
    arbiter.io/managed-by: "onboarding-controller"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    # Allow ingress from ingress controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
    
    # Allow ingress from same namespace
    - from:
        - podSelector: {}
  
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    
    # Allow egress to same namespace
    - to:
        - podSelector: {}
    
    # Allow egress to internet (for git clone, package downloads, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    
    # Allow egress to Kubernetes API server
    - to:
        - namespaceSelector:
            matchLabels:
              name: default
      ports:
        - protocol: TCP
          port: 443

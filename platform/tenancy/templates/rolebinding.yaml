apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-binding
  namespace: {{TENANT_NAME}}
  labels:
    arbiter.io/tenant: "{{TENANT_NAME}}"
    arbiter.io/managed-by: "onboarding-controller"
    arbiter.io/permission-profile: "{{PERMISSION_PROFILE}}"
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: {{TENANT_NAME}}
roleRef:
  kind: Role
  name: pipeline-runner-{{PERMISSION_PROFILE}}
  apiGroup: rbac.authorization.k8s.io

apiVersion: v1
kind: Secret
metadata:
  name: terraform-backend-config
  namespace: ${TENANT_NAME}
type: Opaque
stringData:
  # Kubernetes backend configuration (simplest, no external dependencies)
  backend.tf: |
    terraform {
      backend "kubernetes" {
        secret_suffix    = "${TENANT_NAME}"
        namespace        = "${TENANT_NAME}"
        in_cluster_config = true
      }
    }

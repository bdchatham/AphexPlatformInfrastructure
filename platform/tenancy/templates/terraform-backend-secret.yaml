apiVersion: v1
kind: Secret
metadata:
  name: terraform-backend
  namespace: {{TENANT_NAME}}
  labels:
    arbiter.io/tenant: "{{TENANT_NAME}}"
    arbiter.io/managed-by: "platform-controller"
type: Opaque
stringData:
  backend.tf: |
    terraform {
      backend "kubernetes" {
        secret_suffix    = "{{TENANT_NAME}}"
        namespace        = "{{TENANT_NAME}}"
        in_cluster_config = true
      }
    }

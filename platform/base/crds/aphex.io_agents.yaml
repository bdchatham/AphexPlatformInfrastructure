---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: agents.aphex.io
spec:
  group: aphex.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.model.name
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is the Schema for the agents API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec defines the desired state of Agent
            properties:
              description:
                description: Description provides context about this agent
                type: string
              displayName:
                description: DisplayName is the human-readable agent name
                type: string
              knowledgeBase:
                description: KnowledgeBase references an existing KnowledgeBase for
                  RAG
                properties:
                  name:
                    description: Name is the KnowledgeBase resource name
                    type: string
                  namespace:
                    description: Namespace is the KnowledgeBase namespace (defaults
                      to Agent namespace)
                    type: string
                required:
                - name
                type: object
              model:
                description: Model defines the model server configuration (always
                  provisioned)
                properties:
                  gpuCount:
                    description: GPUCount is the number of GPUs to allocate
                    format: int32
                    minimum: 1
                    type: integer
                  image:
                    description: Image is the container image for the model server
                    type: string
                  name:
                    description: Name is the model identifier (e.g., meta-llama/Llama-3.1-70B-Instruct)
                    type: string
                  port:
                    description: Port is the model server port
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                  provider:
                    description: Provider is the model serving backend (vllm, openai,
                      anthropic, bedrock)
                    enum:
                    - vllm
                    - openai
                    - anthropic
                    - bedrock
                    type: string
                  quantization:
                    description: Quantization method for the model (e.g., gptq_marlin,
                      awq, fp16)
                    type: string
                required:
                - name
                - provider
                type: object
              orchestration:
                description: |-
                  Orchestration configures the orchestration layer
                  If set, an orchestrator will be provisioned. If nil, no orchestrator.
                properties:
                  image:
                    description: Image is the orchestrator container image
                    type: string
                  port:
                    description: Port is the orchestrator port
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                type: object
            required:
            - displayName
            - model
            type: object
          status:
            description: AgentStatus defines the observed state of Agent
            properties:
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the last reconciliation
                format: date-time
                type: string
              message:
                description: Message provides human-readable status information
                type: string
              modelServer:
                description: ModelServer contains the status of the model server
                properties:
                  deployed:
                    description: Deployed indicates whether the model server is deployed
                    type: boolean
                  readyReplicas:
                    description: ReadyReplicas is the number of ready model server
                      replicas
                    format: int32
                    type: integer
                  serviceName:
                    description: ServiceName is the Kubernetes service name for the
                      model server
                    type: string
                  serviceURL:
                    description: ServiceURL is the internal cluster URL for the model
                      server
                    type: string
                type: object
              orchestrator:
                description: Orchestrator contains the status of the orchestrator
                  (if enabled)
                properties:
                  deployed:
                    description: Deployed indicates whether the orchestrator is deployed
                    type: boolean
                  readyReplicas:
                    description: ReadyReplicas is the number of ready orchestrator
                      replicas
                    format: int32
                    type: integer
                  serviceName:
                    description: ServiceName is the Kubernetes service name for the
                      orchestrator
                    type: string
                  serviceURL:
                    description: ServiceURL is the internal cluster URL for the orchestrator
                    type: string
                type: object
              phase:
                description: Phase represents the current state (Pending, Ready, Failed)
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

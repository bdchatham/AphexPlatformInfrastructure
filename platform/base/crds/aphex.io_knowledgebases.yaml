---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: knowledgebases.aphex.io
spec:
  group: aphex.io
  names:
    kind: KnowledgeBase
    listKind: KnowledgeBaseList
    plural: knowledgebases
    singular: knowledgebase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.mcp.deployed
      name: MCP
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KnowledgeBase is the Schema for the knowledgebases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KnowledgeBaseSpec defines the desired state of KnowledgeBase
            properties:
              description:
                description: Description provides context about this knowledge base
                type: string
              displayName:
                description: DisplayName is the human-readable knowledge base name
                type: string
              mcp:
                description: |-
                  MCP configures the optional MCP server for this knowledge base
                  If set, an MCP server will be provisioned. If nil/omitted, no MCP server is created.
                properties:
                  image:
                    description: Image is the container image for the MCP server
                    type: string
                  port:
                    description: Port is the port the MCP server listens on
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                  queryServiceURL:
                    description: |-
                      QueryServiceURL is the URL of the query service
                      If empty, controller computes as http://query.{namespace}:8080
                    type: string
                  replicas:
                    description: Replicas is the number of MCP server replicas
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - image
                - port
                type: object
              repositories:
                description: Repositories is the list of repositories to track
                items:
                  description: Repository defines a single repository to track
                  properties:
                    branch:
                      description: 'Branch is the Git branch to track (default: main)'
                      type: string
                    paths:
                      description: |-
                        Paths are the documentation paths to track (default: [".kiro/docs"])
                        Supports glob patterns (e.g., "docs/**/*.md", ".kiro/docs/**")
                      items:
                        type: string
                      type: array
                    url:
                      description: URL is the repository URL (supports GitHub, GitLab,

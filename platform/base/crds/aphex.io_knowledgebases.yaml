---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: knowledgebases.aphex.io
spec:
  group: aphex.io
  names:
    kind: KnowledgeBase
    listKind: KnowledgeBaseList
    plural: knowledgebases
    singular: knowledgebase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.organization
      name: Organization
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.vectorStoreReady
      name: Vector Store
      type: boolean
    - jsonPath: .status.codeGraphReady
      name: Code Graph
      type: boolean
    - jsonPath: .status.mcp.deployed
      name: MCP
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KnowledgeBase is the Schema for the knowledgebases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KnowledgeBaseSpec defines the desired state of KnowledgeBase
            properties:
              description:
                description: Description provides context about this knowledge base
                type: string
              mcp:
                description: |-
                  MCP configures the optional MCP server for this knowledge base
                  If set, an MCP server will be provisioned. If nil/omitted, no MCP server is created.
                properties:
                  image:
                    description: Image is the container image for the MCP server
                    type: string
                  port:
                    description: Port is the port the MCP server listens on
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                  queryServiceURL:
                    description: |-
                      QueryServiceURL is the URL of the query service
                      If empty, controller computes as http://query.{namespace}:8080
                    type: string
                  replicas:
                    default: 1
                    description: Replicas is the number of MCP server replicas
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - image
                - port
                type: object
              name:
                description: Name is the human-readable knowledge base name
                type: string
              organization:
                description: |-
                  Organization references the name of an Organization resource.
                  The controller derives the org namespace as org-{organization}.
                type: string
              sources:
                description: Sources is the list of knowledge sources to track
                items:
                  description: Source defines a single knowledge source to track
                  properties:
                    branch:
                      default: mainline
                      description: 'Branch is the Git branch to track (default: mainline)'
                      type: string
                    paths:
                      description: |-
                        Paths are the file/path patterns to process
                        Supports glob patterns (e.g., ".kiro/docs" for docs, "src/**" for code)
                      items:
                        type: string
                      type: array
                    repoName:
                      description: RepoName is the repository name (e.g., "AphexControllerRuntime")
                      pattern: ^[a-zA-Z0-9._-]+$
                      type: string
                    repoOrg:
                      description: RepoOrg is the repository organization or owner
                        (e.g., "bdchatham")
                      pattern: ^[a-zA-Z0-9._-]+$
                      type: string
                    sourceType:
                      description: SourceType classifies the source as documentation
                        or code
                      enum:
                      - docs
                      - code
                      type: string
                  required:
                  - repoName
                  - repoOrg
                  type: object
                minItems: 1
                type: array
            required:
            - name
            - organization
            - sources
            type: object
          status:
            description: KnowledgeBaseStatus defines the observed state of KnowledgeBase
            properties:
              codeGraphReady:
                description: CodeGraphReady indicates whether the code graph is healthy
                type: boolean
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the last reconciliation
                format: date-time
                type: string
              lastSyncTime:
                description: LastSyncTime is the timestamp of the last successful
                  sync pipeline run
                format: date-time
                type: string
              mcp:
                description: MCP contains the status of the MCP server (if enabled)
                properties:
                  deployed:
                    description: Deployed indicates whether the MCP server is deployed
                    type: boolean
                  readyReplicas:
                    description: ReadyReplicas is the number of ready MCP server replicas
                    format: int32
                    type: integer
                  serviceName:
                    description: ServiceName is the Kubernetes service name for the
                      MCP server
                    type: string
                  serviceURL:
                    description: ServiceURL is the internal cluster URL for the MCP
                      server
                    type: string
                type: object
              message:
                description: Message provides human-readable status information
                type: string
              phase:
                description: Phase represents the current state (Pending, Ready, Failed)
                type: string
              vectorStoreReady:
                description: VectorStoreReady indicates whether the vector store is
                  healthy
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-webhook
  namespace: {{TENANT_NAME}}
  labels:
    aphex/tenant: "{{TENANT_NAME}}"
    aphex/managed-by: "platform-controller"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: {{INGRESS_HOST}}
      http:
        paths:
          - path: /{{TENANT_NAME}}
            pathType: Prefix
            backend:
              service:
                name: el-github-listener
                port:
                  number: 8080

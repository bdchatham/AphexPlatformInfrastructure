apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kubectl-apply
  namespace: pipeline-catalog
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Kubernetes
    tekton.dev/tags: kubectl
    tekton.dev/displayName: "kubectl apply"
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    This Task applies Kubernetes manifests from a directory using kubectl apply.
    It supports recursive directory application and is designed for platform
    upgrade workflows where manifests need to be applied in order.

  params:
    - name: manifest-dir
      description: Directory containing Kubernetes manifests to apply (relative to workspace root)
      type: string
    - name: recursive
      description: Apply manifests recursively from subdirectories
      type: string
      default: "true"
    - name: namespace
      description: Namespace to apply manifests to (if not specified in manifests)
      type: string
      default: ""
    - name: kubectl-image
      description: The image providing kubectl binary
      type: string
      default: "bitnami/kubectl:1.28"

  workspaces:
    - name: source
      description: Workspace containing the manifest files

  steps:
    - name: apply
      image: "$(params.kubectl-image)"
      script: |
        #!/bin/bash
        set -e

        MANIFEST_DIR="$(workspaces.source.path)/$(params.manifest-dir)"
        
        if [ ! -d "${MANIFEST_DIR}" ]; then
          echo "Error: Manifest directory ${MANIFEST_DIR} does not exist"
          exit 1
        fi

        echo "Applying manifests from ${MANIFEST_DIR}"
        
        KUBECTL_ARGS=""
        if [ "$(params.recursive)" = "true" ]; then
          KUBECTL_ARGS="${KUBECTL_ARGS} -R"
        fi
        
        if [ -n "$(params.namespace)" ]; then
          KUBECTL_ARGS="${KUBECTL_ARGS} -n $(params.namespace)"
        fi

        kubectl apply -f "${MANIFEST_DIR}" ${KUBECTL_ARGS}
        
        echo "Successfully applied manifests"

# ValidatingWebhookConfiguration for Platform Controller CRDs
# This implements Requirement 19: Validating Admission Webhook
# THE Platform_Controller SHALL implement a ValidatingWebhookConfiguration for all CRDs.
#
# Note: This configuration requires cert-manager to be installed for automatic
# certificate management. The webhook server must be enabled with --webhook-server-port flag.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: platform-controller-validating-webhook
  annotations:
    cert-manager.io/inject-ca-from: platform-system/repobinding-controller-serving-cert
  labels:
    app.kubernetes.io/name: platform-controller
    app.kubernetes.io/component: webhook
webhooks:
  # RepoBinding validation webhook
    - name: vrepobinding.platform.aphex.io
      admissionReviewVersions:
        - v1
      clientConfig:
        service:
          name: repobinding-controller-webhook
          namespace: platform-system
          path: /validate-aphex-io-v1alpha1-repobinding
          port: 9443
      failurePolicy: Fail
      matchPolicy: Equivalent
      rules:
        - apiGroups:
            - aphex.io
          apiVersions:
            - v1alpha1
          operations:
            - CREATE
            - UPDATE
          resources:
            - repobindings
          scope: Namespaced
      sideEffects: None
      timeoutSeconds: 10
---
# Certificate for repobinding webhook TLS (requires cert-manager)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: repobinding-controller-serving-cert
  namespace: platform-system
  labels:
    app.kubernetes.io/name: repobinding-controller
    app.kubernetes.io/component: webhook
spec:
  dnsNames:
    - repobinding-controller-webhook.platform-system.svc
    - repobinding-controller-webhook.platform-system.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-issuer
  secretName: repobinding-controller-webhook-cert

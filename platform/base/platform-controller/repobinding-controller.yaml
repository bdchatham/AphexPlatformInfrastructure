---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: repobinding-controller
  namespace: platform-system
  labels:
    app: repobinding-controller
    app.kubernetes.io/name: repobinding-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: aphex-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: repobinding-controller
rules:
  - apiGroups: ["aphex.io"]
    resources: ["repobindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aphex.io"]
    resources: ["repobindings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["aphex.io"]
    resources: ["repobindings/finalizers"]
    verbs: ["update"]
  - apiGroups: ["aphex.io"]
    resources: ["organizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["limitranges", "resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates", "triggers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["interceptors", "clusterinterceptors", "clustertriggerbindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: repobinding-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: repobinding-controller
subjects:
  - kind: ServiceAccount
    name: repobinding-controller
    namespace: platform-system
---
apiVersion: v1
kind: Service
metadata:
  name: repobinding-controller-webhook
  namespace: platform-system
  labels:
    app: repobinding-controller
    app.kubernetes.io/name: repobinding-controller
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: aphex-platform
spec:
  ports:
    - name: webhook
      port: 9443
      targetPort: webhook
      protocol: TCP
  selector:
    app: repobinding-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repobinding-controller
  namespace: platform-system
  labels:
    app: repobinding-controller
    app.kubernetes.io/name: repobinding-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: aphex-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repobinding-controller
  template:
    metadata:
      labels:
        app: repobinding-controller
        app.kubernetes.io/name: repobinding-controller
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: aphex-platform
    spec:
      serviceAccountName: repobinding-controller
      containers:
        - name: manager
          image: ghcr.io/bdchatham/repobinding-controller:latest
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --enable-webhooks
            - --webhook-port=9443
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: repobinding-controller-webhook-cert
            defaultMode: 420
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowledgebase-controller
  namespace: platform-system
  labels:
    app: knowledgebase-controller
    app.kubernetes.io/name: knowledgebase-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: aphex-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: knowledgebase-controller
rules:
  - apiGroups: ["aphex.io"]
    resources: ["knowledgebases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aphex.io"]
    resources: ["knowledgebases/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["aphex.io"]
    resources: ["knowledgebases/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: knowledgebase-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: knowledgebase-controller
subjects:
  - kind: ServiceAccount
    name: knowledgebase-controller
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgebase-controller
  namespace: platform-system
  labels:
    app: knowledgebase-controller
    app.kubernetes.io/name: knowledgebase-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: aphex-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledgebase-controller
  template:
    metadata:
      labels:
        app: knowledgebase-controller
        app.kubernetes.io/name: knowledgebase-controller
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: aphex-platform
    spec:
      serviceAccountName: knowledgebase-controller
      containers:
        - name: manager
          image: ghcr.io/bdchatham/knowledgebase-controller:latest
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30

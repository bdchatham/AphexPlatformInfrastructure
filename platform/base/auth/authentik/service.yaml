apiVersion: v1
kind: Service
metadata:
  name: authentik
  namespace: auth-system
  labels:
    app: authentik
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
    - name: https
      port: 9443
      targetPort: https
      protocol: TCP
  selector:
    app: authentik
    component: server

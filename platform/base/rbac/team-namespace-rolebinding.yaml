# RoleBinding Template for Team Namespaces
# This template should be applied to each team-* namespace to grant platform-engineering access
#
# Usage:
#   kubectl apply -f team-namespace-rolebinding.yaml -n team-frontend
#   kubectl apply -f team-namespace-rolebinding.yaml -n team-backend

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-engineer-access
  # namespace: team-* (set when applying)
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-engineer
subjects:
  - kind: Group
    name: platform-engineering
    apiGroup: rbac.authorization.k8s.io

# RoleBinding Template for User Namespaces
# This template should be applied to each user-* namespace to grant platform-engineering access
#
# Usage:
#   kubectl apply -f user-namespace-rolebinding.yaml -n user-alice
#   kubectl apply -f user-namespace-rolebinding.yaml -n user-bob

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-engineer-access
  # namespace: user-* (set when applying)
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-engineer
subjects:
  - kind: Group
    name: platform-engineering
    apiGroup: rbac.authorization.k8s.io

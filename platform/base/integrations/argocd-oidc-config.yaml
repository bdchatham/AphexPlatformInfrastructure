apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  url: https://argocd.home.local
  oidc.config: |
    name: Dex
    issuer: https://dex.home.local
    clientID: argocd
    clientSecret: $oidc.dex.clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups

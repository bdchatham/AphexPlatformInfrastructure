apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: onboarding-controller
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
# RepoBinding CRD permissions
- apiGroups:
  - arbiter.io
  resources:
  - repobindings
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - arbiter.io
  resources:
  - repobindings/status
  verbs:
  - get
  - update
  - patch
# Namespace permissions
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# ServiceAccount permissions
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# Secret permissions
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# RBAC permissions
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# ResourceQuota permissions
- apiGroups:
  - ""
  resources:
  - resourcequotas
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# LimitRange permissions
- apiGroups:
  - ""
  resources:
  - limitranges
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# NetworkPolicy permissions
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# EventListener permissions (Tekton Triggers)
- apiGroups:
  - triggers.tekton.dev
  resources:
  - eventlisteners
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# Service permissions (for EventListener services)
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
# Ingress permissions
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
# Event permissions (for logging)
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: onboarding-controller
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: onboarding-controller
subjects:
- kind: ServiceAccount
  name: onboarding-controller
  namespace: platform-system

apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: auth-system
data:
  config.yaml: |
    issuer: https://dex.homelab.local
    
    storage:
      type: kubernetes
      config:
        inCluster: true
    
    web:
      http: 0.0.0.0:5556
    
    # Enable password database for static passwords
    enablePasswordDB: true
    
    # Static clients for Kubernetes API server
    staticClients:
      - id: kubernetes
        name: Kubernetes
        secret: kubernetes-client-secret
        redirectURIs:
          - http://localhost:8000
          - http://localhost:18000
    
    # GitHub OAuth connector (optional - configure if using GitHub authentication)
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $GITHUB_OAUTH_CLIENT_ID
          clientSecret: $GITHUB_OAUTH_CLIENT_SECRET
          redirectURI: https://dex.homelab.local/callback
          orgs:
            - name: your-github-org
              teams:
                - engineering
    
    # Static users for local authentication
    staticPasswords:
      - email: "admin@homelab.local"
        # Password: admin (bcrypt hash)
        # Generate with: echo password | htpasswd -BinC 10 admin | cut -d: -f2
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: "admin"
        userID: "admin"
        groups:
          - engineering
          - admins
      
      - email: "engineer@homelab.local"
        # Password: engineer (bcrypt hash)
        hash: "$2a$10$DFKYj3hkjXjkjXjkjXjkjOeN7Z8Z8Z8Z8Z8Z8Z8Z8Z8Z8Z8Z8Z8Z8"
        username: "engineer"
        userID: "engineer"
        groups:
          - engineering
    
    # Enable refresh tokens
    expiry:
      signingKeys: "6h"
      idTokens: "24h"
      refreshTokens:
        reuseInterval: "3s"
        validIfNotUsedFor: "2160h"  # 90 days
        absoluteLifetime: "3960h"    # 165 days
    
    # Logging configuration
    logger:
      level: "info"
      format: "json"

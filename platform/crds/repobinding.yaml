apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repobindings.platform.arbiter.io
spec:
  group: platform.arbiter.io
  names:
    kind: RepoBinding
    plural: repobindings
    singular: repobinding
    shortNames:
      - rb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - repoOrg
                - repoName
                - tenantName
              properties:
                repoOrg:
                  type: string
                  description: GitHub organization name
                  pattern: '^[a-z0-9-]+$'
                  minLength: 1
                  maxLength: 63
                repoName:
                  type: string
                  description: GitHub repository name
                  pattern: '^[a-z0-9-]+$'
                  minLength: 1
                  maxLength: 63
                tenantName:
                  type: string
                  description: Tenant namespace name
                  pattern: '^[a-z0-9-]+$'
                  minLength: 1
                  maxLength: 63
                permissionProfile:
                  type: string
                  description: Permission profile for tenant service account
                  enum:
                    - standard
                    - elevated
                  default: standard
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase of onboarding
                  enum:
                    - Pending
                    - Provisioning
                    - Ready
                    - Failed
                message:
                  type: string
                  description: Human-readable status message
                namespaceCreated:
                  type: boolean
                  description: Whether tenant namespace was created
                serviceAccountCreated:
                  type: boolean
                  description: Whether pipeline-runner service account was created
                rbacConfigured:
                  type: boolean
                  description: Whether RBAC (Role + RoleBinding) was configured
                resourceLimitsCreated:
                  type: boolean
                  description: Whether ResourceQuota and LimitRange were created
                networkPolicyCreated:
                  type: boolean
                  description: Whether NetworkPolicy was created
                terraformBackendSecretCreated:
                  type: boolean
                  description: Whether Terraform backend secret was created
                allowlistUpdated:
                  type: boolean
                  description: Whether repository was added to allowlist
                lastReconcileTime:
                  type: string
                  format: date-time
                  description: Timestamp of last reconciliation
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantName
        - name: Repository
          type: string
          jsonPath: .spec.repoOrg
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

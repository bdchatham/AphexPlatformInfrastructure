apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repobindings.arbiter.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # CRDs must be applied first
spec:
  group: arbiter.io
  names:
    kind: RepoBinding
    plural: repobindings
    singular: repobinding
    shortNames:
      - rb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - aphexOrg
                - repoOrg
                - repoName
                - tenantName
                - pipelineName
              properties:
                aphexOrg:
                  type: string
                  pattern: '^[a-z0-9-]+$'
                  description: Aphex organization name (maps to org-{aphexOrg} namespace)
                repoOrg:
                  type: string
                  pattern: '^[a-zA-Z0-9-]+$'
                  description: GitHub organization name
                repoName:
                  type: string
                  pattern: '^[a-zA-Z0-9_.-]+$'
                  description: GitHub repository name
                tenantName:
                  type: string
                  pattern: '^[a-z0-9-]+$'
                  description: Tenant namespace name (will be created with this name)
                pipelineName:
                  type: string
                  pattern: '^[a-z0-9-]+$'
                  description: Name of the Pipeline to trigger when webhooks are received
                permissionProfile:
                  type: string
                  enum:
                    - standard
                    - elevated
                  default: standard
                  description: RBAC permission profile for the tenant (standard or elevated)
                ingressHost:
                  type: string
                  description: Optional ingress hostname for webhook endpoint (defaults to cluster ingress)
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Ready
                    - Failed
                  description: Current provisioning phase
                message:
                  type: string
                  description: Human-readable status message with provisioning details
                webhookURL:
                  type: string
                  description: Full webhook URL for GitHub webhook configuration
                webhookSecret:
                  type: string
                  description: Generated webhook secret (whsec_* format) for GitHub webhook configuration
                namespaceCreated:
                  type: boolean
                  description: Whether tenant namespace has been created
                serviceAccountCreated:
                  type: boolean
                  description: Whether pipeline-runner service account has been created
                rbacCreated:
                  type: boolean
                  description: Whether RBAC resources (Role, RoleBinding) have been created
                quotasCreated:
                  type: boolean
                  description: Whether ResourceQuota and LimitRange have been created
                networkPolicyCreated:
                  type: boolean
                  description: Whether NetworkPolicy for tenant isolation has been created
                terraformSecretCreated:
                  type: boolean
                  description: Whether Terraform backend secret has been created
                allowlistUpdated:
                  type: boolean
                  description: Whether repository has been added to the allowlist (legacy)
                webhookSecretCreated:
                  type: boolean
                  description: Whether webhook secret has been created
                eventListenerCreated:
                  type: boolean
                  description: Whether Tekton EventListener has been created
                ingressCreated:
                  type: boolean
                  description: Whether Ingress for webhook routing has been created
                triggerBindingCreated:
                  type: boolean
                  description: Whether TriggerBinding has been created
                triggerTemplateCreated:
                  type: boolean
                  description: Whether TriggerTemplate has been created
                triggerCreated:
                  type: boolean
                  description: Whether Trigger has been created
                lastReconcileTime:
                  type: string
                  format: date-time
                  description: Timestamp of last reconciliation
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Org
          type: string
          jsonPath: .spec.repoOrg
        - name: Repo
          type: string
          jsonPath: .spec.repoName
        - name: Tenant
          type: string
          jsonPath: .spec.tenantName
        - name: Pipeline
          type: string
          jsonPath: .spec.pipelineName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Webhook URL
          type: string
          jsonPath: .status.webhookURL
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

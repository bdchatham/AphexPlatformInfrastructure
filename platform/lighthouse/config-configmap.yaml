apiVersion: v1
kind: ConfigMap
metadata:
  name: config
  namespace: pipeline-system
  labels:
    app: lighthouse
    component: config
data:
  config.yaml: |
    # Lighthouse configuration
    
    # In-repo configuration
    in_repo_config:
      enabled:
        "*": true
      allowed_clusters:
        "*": ["*"]
    
    # Plank configuration (PipelineRun creation)
    plank:
      job_url_template: 'http://tekton-dashboard.pipeline-system/pipelineruns/{{.Namespace}}/{{.PipelineRun}}'
      report_template: 'Job {{.Spec.Job}} {{.Status.State}}. [Details]({{.Status.URL}})'
    
    # Prowjob namespace
    prowjob_namespace: pipeline-system
    
    # Pod namespace
    pod_namespace: pipeline-system
    
    # Postsubmit jobs for platform repository
    postsubmits:
      bdchatham/ArbiterPipelineInfrastructure:
        - name: platform-upgrade
          context: platform-upgrade
          always_run: true
          skip_report: false
          branches:
            - ^main$
            - ^mainline$
          spec:
            containers:
              - image: gcr.io/tekton-releases/github.com/tektoncd/pipeline/cmd/entrypoint:v0.56.0
                command:
                  - /ko-app/entrypoint
                args:
                  - --namespace=tenant-platform-infra
                  - --pipelinerun=platform-upgrade-$(PROW_JOB_ID)
                  - --pipeline=platform-upgrade-pipeline
                  - --param=repo-url=$(REPO_URL)
                  - --param=revision=$(PULL_BASE_SHA)
                  - --workspace=name=source,volumeClaimTemplate=accessModes=ReadWriteOnce;resources=requests=storage=1Gi

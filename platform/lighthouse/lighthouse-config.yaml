apiVersion: v1
kind: ConfigMap
metadata:
  name: lighthouse-config
  namespace: pipeline-system
  labels:
    app: lighthouse
    component: config
data:
  config.yaml: |
    # Lighthouse configuration for Jenkins X platform
    
    # In-repo configuration
    # Enable reading .lighthouse/jenkins-x/ directories from repositories
    in_repo_config:
      enabled: true
      # Allow all repositories to define their own trigger configurations
      allowed_clusters:
        "*": ["*"]
    
    # Plank configuration (PipelineRun creation)
    plank:
      # Maximum number of concurrent PipelineRuns per tenant
      max_concurrency: 5
      
      # PipelineRun timeout
      default_timeout: 3600  # 1 hour
      
      # Job URL template for linking to Tekton Dashboard
      job_url_template: 'http://tekton-dashboard.pipeline-system/pipelineruns/{{.Namespace}}/{{.PipelineRun}}'
      
      # Report template for GitHub status
      report_template: 'Job {{.Spec.Job}} {{.Status.State}}. [Details]({{.Status.URL}})'
    
    # Prowjob namespace (where Lighthouse creates jobs)
    prowjob_namespace: pipeline-system
    
    # Pod namespace (where pipeline pods run)
    pod_namespace: pipeline-system
    
    # Logging configuration
    log_level: info

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah-build
  namespace: pipeline-catalog
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Image Build
    tekton.dev/tags: buildah, docker, image-build, oci
    tekton.dev/displayName: "buildah build and push"
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    This Task builds and pushes a container image using Buildah.
    Buildah is a tool for building OCI container images without requiring
    a Docker daemon, making it ideal for Kubernetes-native CI/CD pipelines.

  params:
    - name: IMAGE
      description: Name (reference) of the image to build and push
      type: string
    - name: DOCKERFILE
      description: Path to the Dockerfile to build (relative to context)
      type: string
      default: "./Dockerfile"
    - name: CONTEXT
      description: The build context used by Buildah
      type: string
      default: "./"
    - name: TLSVERIFY
      description: Verify the TLS on the registry endpoint
      type: string
      default: "true"
    - name: FORMAT
      description: The format of the built container (oci or docker)
      type: string
      default: "oci"
    - name: BUILD_EXTRA_ARGS
      description: Extra args to pass to buildah bud
      type: string
      default: ""
    - name: PUSH_EXTRA_ARGS
      description: Extra args to pass to buildah push
      type: string
      default: ""
    - name: BUILDER_IMAGE
      description: The image on which builds will run
      type: string
      default: "quay.io/buildah/stable:v1.35"

  workspaces:
    - name: source
      description: Workspace containing the source code to build
    - name: dockerconfig
      description: Docker config secret for authentication
      optional: false

  results:
    - name: IMAGE_DIGEST
      description: Digest of the image just built
    - name: IMAGE_URL
      description: URL of the image just built

  steps:
    - name: build
      image: $(params.BUILDER_IMAGE)
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        
        echo "Building image $(params.IMAGE)"
        
        buildah --storage-driver=vfs bud \
          $(params.BUILD_EXTRA_ARGS) \
          --format=$(params.FORMAT) \
          --tls-verify=$(params.TLSVERIFY) \
          --no-cache \
          -f $(params.DOCKERFILE) \
          -t $(params.IMAGE) \
          $(params.CONTEXT)
        
        echo "Build complete"
      securityContext:
        capabilities:
          add:
            - SETFCAP
      volumeMounts:
        - name: varlibcontainers
          mountPath: /var/lib/containers

    - name: push
      image: $(params.BUILDER_IMAGE)
      workingDir: $(workspaces.source.path)
      env:
        - name: REGISTRY_AUTH_FILE
          value: $(workspaces.dockerconfig.path)/config.json
      script: |
        #!/usr/bin/env bash
        set -e
        
        echo "Pushing image $(params.IMAGE)"
        
        buildah --storage-driver=vfs push \
          $(params.PUSH_EXTRA_ARGS) \
          --tls-verify=$(params.TLSVERIFY) \
          --digestfile=$(results.IMAGE_DIGEST.path) \
          $(params.IMAGE) \
          docker://$(params.IMAGE)
        
        echo "Push complete"
        cat $(results.IMAGE_DIGEST.path)
      securityContext:
        capabilities:
          add:
            - SETFCAP
      volumeMounts:
        - name: varlibcontainers
          mountPath: /var/lib/containers

    - name: write-url
      image: docker.io/library/bash:5.2.26
      script: |
        #!/usr/bin/env bash
        set -e
        echo -n "$(params.IMAGE)" | tee $(results.IMAGE_URL.path)

  volumes:
    - name: varlibcontainers
      emptyDir: {}

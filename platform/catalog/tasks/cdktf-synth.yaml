apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cdktf-synth
  namespace: pipeline-catalog
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Infrastructure
    tekton.dev/tags: cdktf, terraform, infrastructure-as-code
    tekton.dev/displayName: "cdktf synth"
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    This Task runs cdktf synth to generate Terraform configuration from CDKTF code.
    It is designed for use in the Aphex Pipeline Infrastructure to synthesize
    infrastructure-as-code before deployment.

  params:
    - name: workingDir
      description: Working directory containing CDKTF code
      type: string
      default: "."
    - name: runnerImage
      description: Container image with node, cdktf, and terraform
      type: string
      default: "ghcr.io/bdchatham/pipeline-runner:latest"
    - name: npmInstall
      description: Run npm install before cdktf synth
      type: string
      default: "true"
    - name: verbose
      description: Enable verbose output
      type: string
      default: "false"

  workspaces:
    - name: source
      description: Workspace containing the CDKTF code

  results:
    - name: synth-status
      description: Status of the cdktf synth operation (success or failure)

  steps:
    - name: install-dependencies
      image: "$(params.runnerImage)"
      workingDir: "$(workspaces.source.path)/$(params.workingDir)"
      script: |
        #!/bin/bash
        set -e

        if [ "$(params.npmInstall)" = "true" ]; then
          echo "Installing npm dependencies..."
          if [ "$(params.verbose)" = "true" ]; then
            npm install
          else
            npm install --silent
          fi
          echo "Dependencies installed successfully"
        else
          echo "Skipping npm install"
        fi

    - name: synth
      image: "$(params.runnerImage)"
      workingDir: "$(workspaces.source.path)/$(params.workingDir)"
      script: |
        #!/bin/bash
        set -e

        echo "Running cdktf synth..."
        
        if [ "$(params.verbose)" = "true" ]; then
          cdktf synth
        else
          cdktf synth 2>&1 | grep -v "^\[" || true
        fi

        # Check if synth was successful by verifying cdktf.out exists
        if [ -d "cdktf.out" ]; then
          echo "CDKTF synth completed successfully"
          echo "Generated Terraform configuration in cdktf.out/"
          ls -la cdktf.out/
          echo "success" > "$(results.synth-status.path)"
        else
          echo "ERROR: cdktf synth failed - cdktf.out directory not found"
          echo "failure" > "$(results.synth-status.path)"
          exit 1
        fi

    - name: validate-output
      image: "$(params.runnerImage)"
      workingDir: "$(workspaces.source.path)/$(params.workingDir)"
      script: |
        #!/bin/bash
        set -e

        echo "Validating synthesized Terraform configuration..."
        
        # Find all stack directories in cdktf.out
        for stack_dir in cdktf.out/stacks/*; do
          if [ -d "$stack_dir" ]; then
            stack_name=$(basename "$stack_dir")
            echo "Validating stack: $stack_name"
            
            cd "$stack_dir"
            
            # Check if main.tf.json exists
            if [ ! -f "cdk.tf.json" ]; then
              echo "ERROR: cdk.tf.json not found in $stack_name"
              exit 1
            fi
            
            # Run terraform validate
            terraform init -backend=false
            terraform validate
            
            echo "Stack $stack_name validated successfully"
            cd - > /dev/null
          fi
        done
        
        echo "All stacks validated successfully"

apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cdktf-deploy-pipeline
  namespace: pipeline-catalog
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Infrastructure
    tekton.dev/tags: cdktf, terraform, infrastructure-as-code, deployment
    tekton.dev/displayName: "CDKTF Deploy Pipeline"
spec:
  description: >-
    This Pipeline orchestrates the complete CDKTF deployment workflow:
    1. Clone repository at specific commit SHA
    2. Synthesize Terraform configuration from CDKTF code
    3. Deploy infrastructure with remote state management
    4. Upload artifacts for inspection and auditing
    
    Designed for use in the Arbiter Pipeline Infrastructure with tenant isolation
    and comprehensive observability.

  params:
    - name: repo-url
      description: Git repository URL to clone
      type: string
    - name: commit-sha
      description: Git commit SHA to checkout and deploy
      type: string
    - name: tenant-name
      description: Tenant namespace name for RBAC and state isolation
      type: string
    - name: branch
      description: Git branch name (for reference only)
      type: string
      default: "main"
    - name: runner-image
      description: Container image with node, cdktf, terraform, and kubectl
      type: string
      default: "ghcr.io/bdchatham/pipeline-runner:latest"
    - name: auto-approve
      description: Automatically approve terraform apply
      type: string
      default: "true"
    - name: upload-artifacts
      description: Upload artifacts to external storage
      type: string
      default: "false"
    - name: storage-endpoint
      description: S3-compatible storage endpoint for artifacts
      type: string
      default: "http://minio.storage-system.svc.cluster.local:9000"
    - name: storage-bucket
      description: S3 bucket name for artifacts
      type: string
      default: "pipeline-artifacts"
    - name: verbose
      description: Enable verbose output for all tasks
      type: string
      default: "false"

  workspaces:
    - name: source
      description: Workspace for cloning repository and running CDKTF
    - name: terraform-backend
      description: Workspace containing Terraform backend configuration
      optional: true
    - name: storage-credentials
      description: Workspace containing S3 credentials for artifact upload
      optional: true

  results:
    - name: commit
      description: The precise commit SHA that was deployed
      value: $(tasks.clone.results.commit)
    - name: synth-status
      description: Status of the cdktf synth operation
      value: $(tasks.synth.results.synth-status)
    - name: deploy-status
      description: Status of the cdktf deploy operation
      value: $(tasks.deploy.results.deploy-status)
    - name: outputs
      description: Terraform outputs from the deployment
      value: $(tasks.deploy.results.outputs)
    - name: artifact-url
      description: URL to access uploaded artifacts (if enabled)
      value: $(tasks.upload-artifacts.results.artifact-url)

  tasks:
    - name: clone
      taskRef:
        name: git-clone
        kind: Task
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.commit-sha)
        - name: deleteExisting
          value: "true"
        - name: verbose
          value: $(params.verbose)
      workspaces:
        - name: output
          workspace: source

    - name: synth
      taskRef:
        name: cdktf-synth
        kind: Task
      runAfter:
        - clone
      params:
        - name: runnerImage
          value: $(params.runner-image)
        - name: npmInstall
          value: "true"
        - name: verbose
          value: $(params.verbose)
      workspaces:
        - name: source
          workspace: source

    - name: deploy
      taskRef:
        name: cdktf-deploy
        kind: Task
      runAfter:
        - synth
      params:
        - name: tenantName
          value: $(params.tenant-name)
        - name: runnerImage
          value: $(params.runner-image)
        - name: autoApprove
          value: $(params.auto-approve)
        - name: verbose
          value: $(params.verbose)
      workspaces:
        - name: source
          workspace: source
        - name: terraform-backend
          workspace: terraform-backend

    - name: upload-artifacts
      taskRef:
        name: upload-artifacts
        kind: Task
      runAfter:
        - deploy
      when:
        - input: "$(params.upload-artifacts)"
          operator: in
          values: ["true", "True", "TRUE"]
      params:
        - name: tenantName
          value: $(params.tenant-name)
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: storageEndpoint
          value: $(params.storage-endpoint)
        - name: storageBucket
          value: $(params.storage-bucket)
        - name: runnerImage
          value: $(params.runner-image)
        - name: verbose
          value: $(params.verbose)
      workspaces:
        - name: source
          workspace: source
        - name: storage-credentials
          workspace: storage-credentials

  finally:
    - name: cleanup
      params:
        - name: tenant-name
          value: $(params.tenant-name)
        - name: commit-sha
          value: $(params.commit-sha)
        - name: deploy-status
          value: $(tasks.deploy.results.deploy-status)
      taskSpec:
        params:
          - name: tenant-name
          - name: commit-sha
          - name: deploy-status
        steps:
          - name: log-summary
            image: alpine:3.18
            script: |
              #!/bin/sh
              echo "========================================="
              echo "Pipeline Execution Summary"
              echo "========================================="
              echo "Tenant: $(params.tenant-name)"
              echo "Commit: $(params.commit-sha)"
              echo "Deploy Status: $(params.deploy-status)"
              echo "Pipeline Run: $(context.pipelineRun.name)"
              echo "Namespace: $(context.pipelineRun.namespace)"
              echo "========================================="
              
              if [ "$(params.deploy-status)" = "success" ]; then
                echo "✓ Deployment completed successfully"
                exit 0
              else
                echo "✗ Deployment failed"
                exit 0
              fi

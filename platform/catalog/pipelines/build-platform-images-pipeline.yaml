apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: build-platform-images
  namespace: pipeline-catalog
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    tekton.dev/pipelines.minVersion: "0.12.1"
spec:
  description: >-
    Pipeline to build and push platform container images to GHCR.
    Builds the pipeline-runner image used by various Tekton tasks.

  params:
    - name: repo-url
      description: Git repository URL
      type: string
    - name: revision
      description: Git revision (commit SHA, branch, or tag)
      type: string
      default: "mainline"
    - name: image-registry
      description: Container registry to push images to
      type: string
      default: "ghcr.io"
    - name: image-namespace
      description: Namespace/organization in the registry
      type: string
      default: "bdchatham"
    - name: git-commit-sha
      description: Git commit SHA for tagging images
      type: string
      default: "latest"

  workspaces:
    - name: shared-data
      description: Workspace for sharing data between tasks
    - name: docker-credentials
      description: Docker config for pushing to registry

  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-data
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: depth
          value: "1"

    - name: build-pipeline-runner
      runAfter:
        - fetch-source
      taskRef:
        name: buildah-build
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: IMAGE
          value: "$(params.image-registry)/$(params.image-namespace)/pipeline-runner:$(params.git-commit-sha)"
        - name: DOCKERFILE
          value: "./platform/catalog/images/runner/Dockerfile"
        - name: CONTEXT
          value: "./platform/catalog/images/runner"

    - name: tag-latest
      runAfter:
        - build-pipeline-runner
      taskRef:
        name: buildah-build
      when:
        - input: "$(params.revision)"
          operator: in
          values: ["mainline", "main"]
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials
      params:
        - name: IMAGE
          value: "$(params.image-registry)/$(params.image-namespace)/pipeline-runner:latest"
        - name: DOCKERFILE
          value: "./platform/catalog/images/runner/Dockerfile"
        - name: CONTEXT
          value: "./platform/catalog/images/runner"

  results:
    - name: IMAGE_DIGEST
      description: Digest of the built image
      value: $(tasks.build-pipeline-runner.results.IMAGE_DIGEST)
    - name: IMAGE_URL
      description: URL of the built image
      value: $(tasks.build-pipeline-runner.results.IMAGE_URL)

apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: auth-system
data:
  config.yaml: |
    issuer: https://dex.home.local
    
    storage:
      type: kubernetes
      config:
        inCluster: true
    
    web:
      http: 0.0.0.0:5556
    
    logger:
      level: info
      format: json
    
    staticClients:
      - id: argocd
        name: ArgoCD
        secretEnv: ARGOCD_CLIENT_SECRET
        redirectURIs:
          - https://argocd.home.local/auth/callback
      
      - id: tekton-dashboard
        name: Tekton Dashboard
        secretEnv: TEKTON_CLIENT_SECRET
        redirectURIs:
          - https://tekton.home.local/auth/callback
    
    connectors:
      - type: oidc
        id: authentik
        name: Authentik
        config:
          issuer: https://auth.home.local/application/o/platform-services/
          clientID: dex-client
          clientSecret: $AUTHENTIK_CLIENT_SECRET
          redirectURI: https://dex.home.local/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          getUserInfo: true
          insecureSkipEmailVerified: true
          insecureEnableGroups: true
          claimMapping:
            groups: groups
    
    expiry:
      signingKeys: "6h"
      idTokens: "24h"
      refreshTokens:
        validIfNotUsedFor: "2160h"
        absoluteLifetime: "3960h"

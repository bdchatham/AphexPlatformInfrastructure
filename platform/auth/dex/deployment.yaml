apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: auth-system
  labels:
    app: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      serviceAccountName: dex
      initContainers:
        - name: wait-for-authentik-oidc
          image: curlimages/curl:8.6.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTHENTIK_URL
              value: http://authentik.auth-system.svc.cluster.local:9000
            - name: AUTHENTIK_APP_SLUG
              value: platform-services
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              DISCOVERY="${AUTHENTIK_URL}/application/o/${AUTHENTIK_APP_SLUG}/.well-known/openid-configuration"
              echo "Waiting for Authentik OIDC discovery: ${DISCOVERY}"
              for i in $(seq 1 120); do
                if curl -fsS -H "Accept: application/json" "${DISCOVERY}" >/dev/null; then
                  echo "Authentik OIDC discovery is available"
                  exit 0
                fi
                echo "Attempt ${i}/120: not ready yet; sleeping 2s"
                sleep 2
              done
              echo "Timed out waiting for Authentik OIDC discovery"
              exit 1
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.37.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/dex
            - serve
            - /etc/dex/config.yaml
          ports:
            - name: http
              containerPort: 5556
              protocol: TCP
          env:
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-secrets
                  key: authentik-client-secret
            - name: ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-secrets
                  key: argocd-client-secret
            - name: TEKTON_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-secrets
                  key: tekton-client-secret
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5556
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5556
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: dex-config
            items:
              - key: config.yaml
                path: config.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # Use cert-manager to generate TLS certificates
    # For self-signed certificates (homelab):
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    # For Let's Encrypt with DNS-01 challenge (requires DNS provider API):
    # cert-manager.io/cluster-issuer: "letsencrypt-dns"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    
    # SSL and ArgoCD configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
spec:
  # Set the ingress controller class
  # Common options: nginx, traefik
  # Adjust based on your ingress controller deployment
  ingressClassName: nginx
  
  tls:
    - hosts:
        - argocd.home.local
      # Secret name where cert-manager will store the TLS certificate
      secretName: argocd-tls
  
  rules:
    - host: argocd.home.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443

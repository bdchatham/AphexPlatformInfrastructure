apiVersion: batch/v1
kind: Job
metadata:
  name: auth-config-sync
  namespace: auth-system
  labels:
    app: auth-config-sync
    component: configuration
spec:
  # Allow up to 3 retries if the job fails
  backoffLimit: 3
  
  # Clean up completed jobs after 1 hour (3600 seconds)
  ttlSecondsAfterFinished: 3600
  
  template:
    metadata:
      labels:
        app: auth-config-sync
        component: configuration
    spec:
      # Use the dedicated ServiceAccount with minimal RBAC permissions
      serviceAccountName: auth-config-sync
      
      # Restart the pod if it fails (up to backoffLimit times)
      restartPolicy: OnFailure
      
      containers:
        - name: config-sync
          # Use bitnami/kubectl image which includes kubectl, curl, jq, and sh
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          
          # Run the sync script
          command: ["/bin/sh"]
          args: ["/scripts/sync-script.sh"]
          
          # Mount the sync script as a ConfigMap
          volumeMounts:
            - name: sync-script
              mountPath: /scripts
              readOnly: true
            
            # Mount secrets via projected volume
            # This provides read-only access to secrets without requiring
            # kubectl get secret permissions in RBAC
            - name: secrets
              mountPath: /secrets
              readOnly: true
          
          # Resource limits to prevent runaway resource usage
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      
      volumes:
        # ConfigMap containing the sync script
        - name: sync-script
          configMap:
            name: auth-config-sync-script
            defaultMode: 0555  # Make script executable
        
        # Projected volume combining multiple secrets
        # This allows the Job to read secrets without kubectl get secret permissions
        - name: secrets
          projected:
            sources:
              # Dex client secret (created during bootstrap)
              - secret:
                  name: dex-secrets
                  items:
                    - key: client-secret
                      path: dex-client-secret
              
              # Authentik API token (created during bootstrap)
              - secret:
                  name: authentik-api-token
                  items:
                    - key: token
                      path: authentik-token

apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration
apiServer:
  extraArgs:
    oidc-issuer-url: "https://dex.home.local"
    oidc-client-id: "kubernetes"
    oidc-username-claim: "email"
    oidc-groups-claim: "groups"
    # Uncomment if using self-signed certificates:
    # oidc-ca-file: "/etc/kubernetes/pki/dex-ca.crt"
  # Uncomment if using self-signed certificates:
  # extraVolumes:
  #   - name: dex-ca
  #     hostPath: /etc/kubernetes/pki/dex-ca.crt
  #     mountPath: /etc/kubernetes/pki/dex-ca.crt
  #     readOnly: true
kubernetesVersion: v1.28.0
controlPlaneEndpoint: "localhost:6443"
networking:
  serviceSubnet: "10.96.0.0/12"
  podSubnet: "10.244.0.0/16"

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform-gateway
      namespace: kube-system
  hostnames:
    - argocd.arbiter-dev.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 443

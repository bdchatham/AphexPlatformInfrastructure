apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: platform-gateway
      namespace: kube-system
  hostnames:
    - tekton.arbiter-dev.com
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097

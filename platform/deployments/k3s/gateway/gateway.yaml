# Platform Gateway - handles all *.arbiter-dev.com traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: kube-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: argocd-https
      protocol: HTTPS
      port: 443
      hostname: argocd.arbiter-dev.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-tls
            namespace: argocd
      allowedRoutes:
        namespaces:
          from: All
    - name: auth-https
      protocol: HTTPS
      port: 443
      hostname: auth.arbiter-dev.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: auth-tls
            namespace: auth-system
      allowedRoutes:
        namespaces:
          from: All
    - name: dex-https
      protocol: HTTPS
      port: 443
      hostname: dex.arbiter-dev.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: dex-tls
            namespace: auth-system
      allowedRoutes:
        namespaces:
          from: All
    - name: tekton-https
      protocol: HTTPS
      port: 443
      hostname: tekton.arbiter-dev.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: tekton-tls
            namespace: tekton-pipelines
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.arbiter-dev.com"
      allowedRoutes:
        namespaces:
          from: All

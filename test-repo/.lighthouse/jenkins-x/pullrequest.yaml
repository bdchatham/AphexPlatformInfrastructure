apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: pr-build
  labels:
    app: pipeline-test
    type: pullrequest
spec:
  pipelineSpec:
    params:
      - name: repo-url
        type: string
      - name: commit-sha
        type: string
    
    workspaces:
      - name: source
    
    tasks:
      - name: clone
        taskRef:
          name: git-clone
          kind: Task
          namespace: pipeline-catalog
        params:
          - name: url
            value: $(params.repo-url)
          - name: revision
            value: $(params.commit-sha)
        workspaces:
          - name: output
            workspace: source
      
      - name: synth
        taskRef:
          name: cdktf-synth
          kind: Task
          namespace: pipeline-catalog
        runAfter:
          - clone
        workspaces:
          - name: source
            workspace: source
  
  params:
    - name: repo-url
      value: $(params.REPO_URL)
    - name: commit-sha
      value: $(params.PULL_PULL_SHA)
  
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  
  serviceAccountName: pipeline-runner
  
  timeout: 30m

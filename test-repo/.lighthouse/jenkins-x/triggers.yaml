apiVersion: config.lighthouse.jenkins-x.io/v1alpha1
kind: TriggerConfig
spec:
  presubmits:
    - name: pr-build
      context: "pr-build"
      always_run: true
      optional: false
      trigger: "/test"
      rerun_command: "/retest"
      source: "pullrequest.yaml"
  
  postsubmits:
    - name: deploy
      context: "deploy"
      source: "release.yaml"
      branches:
        - ^main$
        - ^master$
